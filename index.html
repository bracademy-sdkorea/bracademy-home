/* =======================================================================
   BR ACADEMY · EDITORIAL RESTORATION
   Based on the original airy Claude design: warm linen, original typographic
   hierarchy, arch-shaped real-spa photography, and understated schedule rows.
   No change to course contents, backend schema or privacy flow.
   ======================================================================= */
:root {
  --bg:#EFECE7;
  --paper:#F7F4EF;
  --stone:#E4DED5;
  --ink:#2A2420;
  --deep:#3E362F;
  --sub:#5A5148;
  --muted:#766A5E;
  --accent:#745746;
  --line:#D6CEC2;
  --w:1240px;
  --header-h:84px;
}
body{background:var(--bg);color:var(--ink);line-height:1.75}
.wrap{max-width:1240px;padding-left:36px;padding-right:36px}
.site-header{background:rgba(239,236,231,.96);border-bottom:1px solid rgba(214,206,194,.55)}

.site-header .btn-apply{padding:13px 21px;background:var(--ink);color:#f9f7f2}
.eyebrow{font-weight:400;letter-spacing:.38em;font-size:11px;color:#886D5C}
/* spacious 2-column hero: photo again takes priority, not the black schedule card */
.hero.hero-editorial{background:var(--bg);overflow:visible}
.hero-editorial-inner{display:grid;grid-template-columns:minmax(0,1.20fr) minmax(0,.85fr);align-items:center;column-gap:80px;padding-top:78px;padding-bottom:73px;min-height:625px}

.hero-editorial-copy h1 em{color:var(--ink);font-weight:400;font-style:normal}
.hero-editorial-copy .small-line{height:1px;width:56px;background:var(--ink)}

    return `<div class="course-page"><section class="course-cover"><div class="wrap"><div class="crumb"><a href="#/education">전체 교육과정</a><span>/</span>${esc(t.name)}</div><div class="course-hero"><div><span class="eyebrow">${esc(t.label)} · BR ACADEMY</span><h1>${esc(t.name)}</h1><p class="tag">${esc(t.tagline)}</p><p class="course-partner">${esc(t.partner)}</p><div class="action-row">${applyLink('교육 상담 신청','btn primary',t.name)}${next('교육 일정 확인하기','#/schedule')}</div></div><div>${coursePhoto(t)}</div></div></div></section>
    <section class="course-content section"><div class="wrap">${true?courseListHTML(t):`<span class="eyebrow">교육과정 선택</span><h2 class="course-h2">배우고 싶은 과정을 선택하세요.</h2><div class="course-tabs">${t.courses.map((x,i)=>`<button type="button" data-course="${i}" class="course-tab ${i===sel?'active':''}"><span>${esc(x.lv)}</span><b>${esc(x.kr)}</b><span class="course-name-en" lang="en">${esc(x.en)}</span><small>${esc(x.enrollmentCondition || (x.price==='FREE'?'무료':x.price))}</small></button>`).join('')}</div>
    <div class="course-details"><article class="course-info"><span class="eyebrow">${esc(c.lv)} / ${esc(c.id)}</span><h3>${esc(c.kr)}</h3><div class="course-name-en" lang="en">${esc(c.en)}</div><p>${esc(c.goal)}</p>${t.key==='exo' && c.id==='EX04'?'<div class="course-prereq"><b>필수 선수 과정</b> EXOSKIN + EXOHAIR 수료 후 신청 가능 · 공식 RSC 교육자 자격 과정</div>':''}<div class="course-facts"><div><span>${c.enrollmentCondition?'수강 조건':'수강료'}</span><strong class="${c.enrollmentCondition?'enrollment-condition':''}">${esc(c.enrollmentCondition || (c.price==='FREE'?'무료':c.price))}</strong><small>${esc(c.priceNote)}</small></div><div><span>교육 시간</span><strong>${esc(c.days)}</strong></div></div><p class="course-target"><b>추천 수강 대상</b>${esc(c.target)}</p><div class="course-cta">${applyLink(c.price==='FREE'?'무료 세미나 사전 신청':'이 과정 상담 신청','btn primary',c.kr)}${next('교육 일정 보기','#/schedule')}</div></article>
    <aside class="course-curr"><span class="eyebrow">교육 내용</span><ol>${c.mods.map((m,i)=>`<li><span>${pad(i+1)}</span><b>${esc(m)}</b></li>`).join('')}</ol></aside></div>`}
    ${recommended ? `<div class="recommend"><span class="eyebrow">추천 대상</span><h3>BR SKIN, 이런 분들께 추천합니다.</h3><div>${S.recommendSkin.map((a,i)=>`<article><span>${pad(i+1)}</span><h4>${esc(a[0])}</h4><p>${esc(a[1])}</p></article>`).join('')}</div></div>`:''}
    ${t.packs.length? `<div class="master-wrap"><div class="master-head"><span class="eyebrow">통합 마스터 과정</span><h3>${recommended?'BR 통합 마스터 (1-3단계)':'통합 과정 안내'}</h3><p>${recommended?'BR Academy가 추천하는 체계적인 통합 교육 과정입니다.':'통합 과정을 확인하세요.'}</p></div><div class="master-cards">${t.packs.map(p=>`<article class="master-card"><div class="master-badge">${esc(p.badge||'통합 과정')}</div><h4>${esc(p.name)}</h4><p>${esc(p.tagline||p.desc)}</p><small>${esc(p.description||p.desc)}</small><div class="master-price"><strong>${esc(p.price)}</strong>${p.was?`<del>${esc(p.was)}</del>`:''}</div>${applyLink('통합 과정 상담 신청','master-cta',p.name)}</article>`).join('')}</div></div>`:''}
    <div class="course-foot"><h3>교육을 현장으로 연결하세요.</h3><p>현재 모집 중인 일정은 위에서 확인하고, 간편 상담 신청을 남겨주세요.</p>${applyLink('교육 상담 신청','btn primary',t.name)}</div>
    </div></section></div>`;
  }
  function footerHTML() {
    return `<div class="wrap footer-grid"><div class="footer-brand"><img src="${esc(S.logoVertical)}" alt="BR Academy 로고"><p>PROFESSIONAL AESTHETIC EDUCATION</p></div><div><h4>바로가기</h4><a href="#/education">교육과정</a><a href="#/results">교육성과</a><a href="#/people">교육강사</a><a href="#/journal">칼럼</a></div><div><h4>교육 트랙</h4>${primaryTracks().map(t=>`<a href="#/education/${esc(t.key)}">${esc(t.name)}</a>`).join('')}</div><div><h4>문의</h4><a href="mailto:${esc(S.partnership.email)}">${esc(S.partnership.email)}</a><p>상담 신청은 이름·전화번호만 접수합니다. 온라인 접수 운영 전에는 기존 신청 사이트를 이용해 주세요.</p><a href="${esc(S.applyUrl)}" target="_blank" rel="noopener noreferrer">기존 교육 신청 사이트 ↗</a></div></div><div class="wrap copyright"><span>${esc(S.company)} · © ${new Date().getFullYear()}</span><span>EDUCATION THAT STAYS WITH YOU.</span></div>`;
  }

  function leadModalHTML() {
    const ready = Boolean(db && CFG.privacyRetention);
    return `<dialog class="lead-dialog" id="leadDialog" aria-labelledby="leadTitle"><div class="lead-dialog-body"><button type="button" class="lead-close" data-lead-close aria-label="창 닫기">×</button><span class="eyebrow">BR ACADEMY · QUICK APPLY</span><h2 id="leadTitle">교육 상담 신청</h2><p class="lead-intro">이름과 연락처를 남겨주세요. 교육 담당자가 안내드립니다.</p><div class="lead-course-selected" id="selectedCourseName">관심 교육과정</div>
      <form id="leadForm" novalidate><label for="leadName">이름 <span aria-hidden="true">*</span></label><input id="leadName" name="name" autocomplete="name" maxlength="40" required placeholder="성함"><label for="leadPhone">연락처 <span aria-hidden="true">*</span></label><input id="leadPhone" name="phone" autocomplete="tel" inputmode="tel" maxlength="20" required placeholder="010-0000-0000"><input class="trap" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"><label class="lead-consent"><input type="checkbox" name="consent" required><span>교육 상담을 위한 이름·전화번호 및 선택 교육 정보 수집에 동의합니다. (필수)</span></label><p class="retention-note">수집 목적: 교육 일정 및 상담 안내 · 보유기간: ${ready?esc(CFG.privacyRetention):'관리자 확인 후 설정 예정'}</p><button type="submit" class="lead-submit" ${ready?'':'disabled'}>상담 접수하기 <span>↗</span></button><p class="lead-status" id="leadStatus" role="status"></p></form>
      ${!ready?`<div class="lead-unconfigured"><b>온라인 간편 접수 연결 전입니다.</b><p>현재는 입력 정보가 저장되지 않습니다. 기존 신청 시스템을 이용해 주세요.</p><a href="${esc(S.applyUrl)}" target="_blank" rel="noopener noreferrer">기존 교육 신청 페이지 열기 ↗</a></div>`:''}</div></dialog>`;
  }
  function showLead(course='', classId='') {
    const modal=document.getElementById('leadDialog'); if(!modal)return;
    modal.dataset.classId=classId||'';
    modal.dataset.course=course||'교육 상담';
    modal.querySelector('#selectedCourseName').textContent=course||'관심 교육과정 상담';
    modal.querySelector('#leadForm').reset();
    modal.querySelector('#leadStatus').textContent='';
    if(typeof modal.showModal==='function')modal.showModal();
  }
  async function handleLeadSubmit(e) {
    e.preventDefault();
    const f=e.target, status=f.querySelector('#leadStatus'), btn=f.querySelector('[type=submit]');
    if(!db || !CFG.privacyRetention){status.textContent='접수 저장 기능이 연결되지 않았습니다.';return;}
    const name=f.elements.namedItem('name').value.trim(), phone=f.elements.namedItem('phone').value.trim(), agree=f.elements.namedItem('consent').checked;
    if(!name || !/^[0-9+()\-\s]{9,20}$/.test(phone) || !agree){status.textContent='이름, 연락처와 동의 여부를 확인해 주세요.';return;}
    btn.disabled=true;status.textContent='접수 중입니다…';
    const d=document.getElementById('leadDialog');
    const payload={p_name:name, p_phone:phone,p_course_title:d.dataset.course||'교육 상담',p_class_id:/^[0-9a-f]{8}-[0-9a-f-]{27,}$/.test(d.dataset.classId||'')?d.dataset.classId:null,p_consent:true,p_website:f.elements.namedItem('website').value||''};
    try {const {error}=await db.rpc('submit_br_lead',payload);if(error)throw error;
      f.reset(); status.textContent='상담 신청이 접수되었습니다. 담당자가 연락드리겠습니다.';
    } catch(err) {console.error('Lead submission failed',err);status.textContent='접수에 실패했습니다. 잠시 후 다시 시도하거나 아래 기존 신청 사이트를 이용해 주세요.';}
    finally{btn.disabled=false;}
  }
  async function loadLiveClasses() {
    if(!db) return;
    try {
      const {data,error}=await db.from('br_classes').select('id,course_code,course_title,track,start_date,time_label,location,instructor,status,published').eq('published',true).order('start_date',{ascending:true});
      if(error)throw error;
      state.sessions=(data||[]).map(normalizeClass);state.sessionsLoaded=true;state.sessionsError='';
    } catch(e){console.error('Schedule loading failed',e);state.sessions=[];state.sessionsError='online';}
    route();
  }
  function render() {
    navHTML();
    const t=state.track? getTrack(state.track):null;
    app.innerHTML=(t?trackHTML(t)+educationHTML(t.key):heroHTML()+scheduleHTML()+educationHTML()+philosophyHTML()+resultsHTML()+proofHTML()+practiceHTML()+peopleHTML()+socialHTML()+journalHTML()+faqHTML()+finalCTA())+leadModalHTML();
    footer.innerHTML=footerHTML();
    document.title=t?t.name+' · BR ACADEMY':'BR ACADEMY · 지금 모집 중인 교육';
    document.querySelectorAll('img.photo').forEach(im=>{if(im.complete && !im.naturalWidth) { im.classList.add('missing'); im.parentElement.classList.add('empty-photo'); }});
  }

  function route() {
    const hash=decodeURIComponent((location.hash||'#/').replace(/^#\/?/,''));
    const bits=hash.split('/').filter(Boolean);
    menu.classList.remove('active');document.body.classList.remove('menu-open');menu.setAttribute('aria-expanded','false');
    if(bits[0]==='education' && bits[1] && getTrack(bits[1])) {
      const t=getTrack(bits[1]);state.track=t.key;state.selected=Math.max(0,t.courses.findIndex(c=>c.id===bits[2]));
      render();window.scrollTo(0,0);return;
    }
    state.track=null; render();
    if(bits[0]) requestAnimationFrame(()=>{const el=document.getElementById(bits[0]);if(el)window.scrollTo({top:Math.max(0,el.getBoundingClientRect().top+window.scrollY-header.offsetHeight-10),behavior:'instant'});});
    else window.scrollTo(0,0);
  }
  document.addEventListener('click',e=>{
    const lead=e.target.closest('[data-lead-course]');
    if(lead){e.preventDefault();showLead(lead.dataset.leadCourse,lead.dataset.leadClass);return;}
    if(e.target.closest('[data-lead-close]')) {document.getElementById('leadDialog')?.close();return;}
    if(e.target.id==='leadDialog'){e.target.close();return;}
  });
  document.addEventListener('submit',e=>{if(e.target.id==='leadForm')handleLeadSubmit(e);});
  document.addEventListener('click',e=>{
    const c=e.target.closest('[data-course]');
    if(c && state.track) {const t=getTrack(state.track);const idx=Number(c.dataset.course);const newHash='#/education/'+t.key+'/'+t.courses[idx].id;
      if(location.hash===newHash){state.selected=idx;render();}else location.hash=newHash;
      setTimeout(()=>{const el=document.querySelector('.course-details'); if(el)window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-header.offsetHeight-30,behavior:'smooth'});},40);
      return;
    }
    const f=e.target.closest('[data-filter]');if(f){state.scheduleFilter=f.dataset.filter;render();const el=document.getElementById('schedule');if(el)window.scrollTo(0,el.getBoundingClientRect().top+window.scrollY-header.offsetHeight-15);return;}
    const same=e.target.closest('a[href^="#/"]');if(same && same.getAttribute('href')===location.hash){e.preventDefault();route();}
  });
  menu.addEventListener('click',()=>{const v=document.body.classList.toggle('menu-open');menu.setAttribute('aria-expanded',String(v));menu.classList.toggle('active',v);});
  window.addEventListener('hashchange',route);
  window.addEventListener('scroll',()=>header.classList.toggle('scrolled',window.scrollY>8),{passive:true});
  route();
  loadLiveClasses();
})();

</script>
<script>
(function(){
  function el(){let d=document.getElementById('jv');if(!d){d=document.createElement('div');d.id='jv';d.innerHTML='<div class="jv-box" role="dialog" aria-modal="true"><header><div><small></small><h3></h3></div><button type="button" class="jv-close" aria-label="닫기">×</button></header><div class="jv-pages"></div></div>';document.body.appendChild(d);d.addEventListener('click',e=>{if(e.target===d||e.target.closest('.jv-close'))close();});}return d;}
  function close(){const d=document.getElementById('jv');if(d){d.classList.remove('open');d.querySelector('.jv-pages').innerHTML='';}document.body.classList.remove('jv-open');}
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
  window.brOpenJournal=function(id){const j=(window.SITE.journal||[]).find(x=>x.id===id);if(!j)return;const d=el();
    d.querySelector('small').textContent=j.date+' · '+j.mag+(j.type==='column'?' · 글 김수진':'');d.querySelector('h3').textContent=j.title;
    const p=d.querySelector('.jv-pages');p.innerHTML=j.pages.map((src,i)=>'<img src="'+src+'" alt="'+j.title.replace(/"/g,'')+' 지면 '+(i+1)+'" loading="'+(i<2?'eager':'lazy')+'">').join('')+'<p class="jv-note">'+j.mag+' 게재 지면</p>';p.scrollTop=0;
    d.classList.add('open');document.body.classList.add('jv-open');};
  window.brJournalFilter=function(cat,btn){const sec=btn.closest('.journal-section');sec.querySelectorAll('.journal-filters button').forEach(b=>b.classList.toggle('active',b===btn));
    sec.classList.toggle('filtered',cat!=='all');sec.querySelectorAll('.journal-card').forEach(c=>c.classList.toggle('jhide',cat!=='all'&&c.dataset.jc!==cat));};
})();
</script>
</body>
</html>
